name: Build BANG! Qt6 standalone binaries

# Nuitka compiles native binaries — it cannot cross-compile. This workflow
# runs build_standalone.sh on hosted macOS/Windows/Linux runners so each
# platform gets a binary built by its own native toolchain, then uploads all
# three as build artifacts (and as release assets when triggered by a tag).

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: build/dist/bang-qt
          - os: macos-latest
            name: macos
            artifact: build/dist/qt_app.app
          - os: windows-latest
            name: windows
            artifact: build/dist/bang-qt.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libfluidsynth3 fluid-soundfont-gm

      - name: Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install fluid-synth

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: bash build_standalone.sh

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash build_standalone.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bang-qt-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
